<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script src="./dist/main.js" defer type="module"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/2190736b83.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <main class="main">
      <header class="header">
        <h1>Todo App</h1>
      </header>

      <section class="wrapper">
        <form class="todo-form">
          <input
            id="todo-input"
            type="text"
            placeholder="Add Task...."
            autocomplete="off"
          />
          <button id="add-button">ADD</button>
        </form>

        <div class="filters">
          <span class="filter active" data-filter="all">All</span>
          <span class="filter" data-filter="active">Active</span>
          <span class="filter" data-filter="completed">Completed</span>
        </div>

        <ul id="todo-list">
          <li id="todo">
            <input type="checkbox" id="todo-1" />
            <label for="todo-1" class="custom-checkbox"
              ><i class="fa-solid fa-check"></i
            ></label>
            <label for="todo-1" class="todo-text">Buy shawarma</label>
            <button><i class="fa-solid fa-pen"></i></button>
            <button><i class="fa-solid fa-trash"></i></button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
